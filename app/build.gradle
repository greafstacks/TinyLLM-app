plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.tinyllm'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tinyllm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed debug signing key, committed as app/debug.keystore. Without this,
    // Gradle auto-generates a NEW random debug key on any machine where
    // ~/.android/debug.keystore doesn't already exist -- which is every
    // single GitHub Actions run, since it's always a fresh machine. That
    // means every build would get a different signature, and Android
    // refuses to install an update whose signature doesn't match the
    // currently-installed app. Pinning one real keystore file is what
    // makes "install the new APK over the old one" actually work.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
}
